<div class="thc__loginForm-wrapper">
  <div class="thc__loginForm-container section__margin">
    <img
      src=".././../../../assets/earth.png"
      alt="logo"
      width="50px"
      height="50px"
    />
    <h3>Login</h3>
    <form
      nz-form
      [formGroup]="validateForm"
      class="login-form"
      (ngSubmit)="submitForm()"
    >
      <div nz-row [nzGutter]="[16, 16]">
        <div nz-col nzSpan="24">
          <nz-form-item>
            <nz-form-control nzErrorTip="Please enter your email!">
              <nz-input-group nzPrefixIcon="user">
                <input
                  type="text"
                  nz-input
                  formControlName="email"
                  placeholder="Email"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzSpan="24">
          <nz-form-item>
            <nz-form-control nzErrorTip="Please enter your Password!">
              <nz-input-group nzPrefixIcon="lock">
                <input
                  type="password"
                  nz-input
                  formControlName="password"
                  placeholder="Password"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <div class="thc__loginBtnsLinks">
        <button nz-button type="submit" nzType="primary">Login</button>
        <a routerLink="/forgot-password" style="color: blue">
          Forgot you password?
        </a>
        <p>
          Don't have an account?
          <a style="color: blue" routerLink="/register">Sign Up</a>
        </p>
      </div>
    </form>
  </div>
</div>
