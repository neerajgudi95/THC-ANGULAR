<div class="thc__registration-wrapper section__padding">
  <div class="thc__registration-container">
    <img
      src="../../../../assets/earth.png"
      alt="logo"
      width="50px"
      height="50px"
    />
    <h3>Join Us</h3>
    <form
      nz-form
      [formGroup]="validateForm"
      (ngSubmit)="submitForm()"
      nzLayout="vertical"
    >
      <div nz-row [nzGutter]="[8, 8]">
        <div nz-col="" nzSpan="24">
          <div nz-row [nzGutter]="[16, 8]">
            <div nz-col="" nzSpan="12">
              <nz-form-item>
                <nz-form-label nzRequired>Email</nz-form-label>
                <nz-form-control nzErrorTip="Please enter valid email id">
                  <input nz-input formControlName="email" />
                </nz-form-control>
              </nz-form-item>
            </div>
            <div nz-col="" nzSpan="12">
              <nz-form-item>
                <nz-form-label nzRequired>Name</nz-form-label>
                <nz-form-control nzErrorTip="Please enter your name!">
                  <input nz-input formControlName="fullName" />
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
        </div>
        <div nz-col="" nzSpan="24">
          <div nz-row [nzGutter]="[16, 8]">
            <div nz-col="" nzSpan="12">
              <nz-form-item>
                <nz-form-label nzRequired>Password</nz-form-label>
                <nz-form-control nzErrorTip="Please enter your password!">
                  <input
                    nz-input
                    type="password"
                    formControlName="password"
                    (ngModelChange)="updateConfirmValidator()"
                  />
                </nz-form-control>
              </nz-form-item>
            </div>
            <div nz-col="" nzSpan="12">
              <nz-form-item>
                <nz-form-label nzRequired>Confirm password</nz-form-label>
                <nz-form-control [nzErrorTip]="errorTpl">
                  <input
                    nz-input
                    type="password"
                    formControlName="checkPassword"
                  />
                  <ng-template #errorTpl let-control>
                    <ng-container *ngIf="control.hasError('required')"
                      >Please confirm your password!</ng-container
                    >
                    <ng-container *ngIf="control.hasError('confirm')">
                      Passwords do not match!
                    </ng-container>
                  </ng-template>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
        </div>
        <div nz-col="" nzSpan="24">
          <div nz-row [nzGutter]="[16, 8]">
            <div nz-col="" nzSpan="12">
              <nz-form-item>
                <nz-form-label nzRequired>Phone number</nz-form-label>
                <nz-form-control nzErrorTip="Please enter your phone number!">
                  <input formControlName="phoneNumber" nz-input />
                </nz-form-control>
              </nz-form-item>
            </div>
            <div nz-col="" nzSpan="12">
              <nz-form-item>
                <nz-form-label nzRequired>Profession</nz-form-label>
                <nz-form-control nzErrorTip="Please enter your profession!">
                  <input nz-input form />
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
        </div>

        <div nz-col="" nzSpan="24" class="register-area">
          <button nz-button nzType="primary">Register</button>
        </div>
        <div nz-col="" nzSpan="24">
          <p class="register-area">
            Already have an account?
            <a
              type="button"
              routerLink="/login"
              style="color: blue"
              nzType="link"
            >
              Login
            </a>
          </p>
        </div>
      </div>
    </form>
  </div>
</div>
